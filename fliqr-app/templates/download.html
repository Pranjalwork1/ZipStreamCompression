<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% if found %}Download {{ filename }}{% else %}File Not Found{% endif %} — FliQR</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0b0f19;
            --bg-card: rgba(18, 24, 38, 0.9);
            --border-card: rgba(255, 255, 255, 0.08);
            --accent-primary: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.3);
            --btn-gradient: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            --btn-active: #4338ca;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --success: #10b981;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 20px;
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(99, 102, 241, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 50% 90%, rgba(16, 185, 129, 0.08) 0%, transparent 60%);
        }

        .header {
            text-align: center;
            padding-top: 12px;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #a5b4fc, #6366f1, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .main-content {
            width: 100%;
            max-width: 440px;
            margin: auto;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-card);
            border-radius: 28px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 40px -10px var(--accent-glow);
        }

        .file-badge {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: rgba(99, 102, 241, 0.12);
            border: 1px solid rgba(99, 102, 241, 0.25);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #818cf8;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.15);
        }

        .filename {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.35;
            word-break: break-word;
            margin-bottom: 8px;
        }

        .filesize-tag {
            display: inline-block;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 999px;
            margin-bottom: 32px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Large Tappable Download Button */
        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 18px 24px;
            background: var(--btn-gradient);
            color: #ffffff;
            font-size: 17px;
            font-weight: 700;
            text-decoration: none;
            border-radius: 18px;
            box-shadow: 0 12px 25px -4px rgba(99, 102, 241, 0.5), 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }

        .download-btn:active {
            transform: scale(0.97);
            box-shadow: 0 6px 15px -2px rgba(99, 102, 241, 0.4);
        }

        .device-note {
            margin-top: 16px;
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* 404 State */
        .not-found-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--error);
        }

        .home-btn {
            display: inline-block;
            margin-top: 24px;
            padding: 14px 24px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            text-decoration: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
        }

        .footer {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            padding-bottom: 12px;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 7h.01"/><path d="M17 7h.01"/><path d="M7 17h.01"/><path d="M17 17h.01"/>
            </svg>
            FliQR
        </div>
    </header>

    <main class="main-content">
        <div class="card">
            {% if found %}
                <!-- File Ready Download View -->
                <div class="file-badge">
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="12" x2="12" y1="18" y2="12"/>
                        <polyline points="9 15 12 18 15 15"/>
                    </svg>
                </div>

                <h1 class="filename">{{ filename }}</h1>
                <div class="filesize-tag">{{ size_mb }} MB</div>

                <a href="{{ download_url }}" class="download-btn" id="downloadBtn" download>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" x2="12" y1="15" y2="3"/>
                    </svg>
                    Download to Device
                </a>

                <div class="device-note">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="16" y2="12"/><line x1="12" x2="12.01" y1="8" y2="8"/>
                    </svg>
                    Saved directly to your phone's downloads
                </div>
            {% else %}
                <!-- 404 / Expired File View -->
                <div class="not-found-icon">
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/><line x1="15" x2="9" y1="9" y2="15"/><line x1="9" x2="15" y1="9" y2="15"/>
                    </svg>
                </div>

                <h1 class="filename">File Not Found</h1>
                <p style="color: var(--text-secondary); font-size: 14px; margin-bottom: 20px;">
                    This file link has expired or does not exist.
                </p>

                <a href="/" class="home-btn">Go to Upload</a>
            {% endif %}
        </div>
    </main>

    <footer class="footer">
        Powered by FliQR • Direct Device-to-Device Delivery
    </footer>
</body>
</html>
